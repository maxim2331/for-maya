<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>&#10084; a little something for you &#10084;</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><style>  :root{    --void:#0b0416; --neon:#b14eff; --magenta:#ff4ecd; --cyan:#2de2e6;    --heart-bright:#c77dff; --text:#f3e8ff; --soft:#d9b8ff;  }  *{box-sizing:border-box;}  html,body{margin:0;padding:0;}  body{    background:      radial-gradient(1200px 700px at 20% -10%, #2a0f4d 0%, transparent 60%),      radial-gradient(1000px 600px at 90% 10%, #3a0f3f 0%, transparent 55%),      radial-gradient(900px 900px at 50% 120%, #1c0a3a 0%, transparent 60%),      var(--void);    color:var(--text); font-family:'Nunito',system-ui,sans-serif;    min-height:100vh; overflow-x:hidden;  }   #animeBg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}  #animeBg img{position:absolute;width:var(--w,120px);opacity:0;    filter:drop-shadow(0 0 16px rgba(177,78,255,.5));    animation:floaty var(--dur,28s) ease-in-out var(--delay,0s) infinite;}  @keyframes floaty{    0%{transform:translate3d(0,0,0) rotate(var(--r0,-6deg));opacity:0;}    14%{opacity:var(--peak,.3);}    50%{transform:translate3d(var(--dx,40px),var(--dy,-55px),0) rotate(var(--r1,6deg));opacity:var(--peak,.3);}    86%{opacity:var(--peak,.3);}    100%{transform:translate3d(0,0,0) rotate(var(--r0,-6deg));opacity:0;}  }  @media (max-width:700px){ #animeBg img{width:calc(var(--w,120px)*.6);--peak:.16;} }  @media (prefers-reduced-motion:reduce){ #animeBg img{animation:none;opacity:.2;} }   #ambient{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
